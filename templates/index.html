<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172231" />
    <meta name="description" content="태블릿에서 그림을 그리고 PC로 보내는 로컬 스프라이트 도구" />
    <title>Hop Hop 그림 전송</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <span class="brand__mark" aria-hidden="true">↥</span>
        <div>
          <p class="eyebrow">HOP-HOP JUMP DETECTION</p>
          <h1>그려서 PC로 보내기</h1>
        </div>
      </header>

      <section class="upload-card" aria-labelledby="upload-title">
        <div class="step-heading">
          <span>01</span>
          <div>
            <h2 id="upload-title">그리거나 이미지 선택</h2>
            <p>사이트에서 바로 그리거나, 앨범에 있는 이미지를 불러오세요.</p>
          </div>
        </div>

        <div class="mode-switch" role="tablist" aria-label="이미지 만들기 방법">
          <button type="button" id="draw-tab" role="tab" aria-selected="true" aria-controls="draw-panel">직접 그리기</button>
          <button type="button" id="file-tab" role="tab" aria-selected="false" aria-controls="file-panel">파일 선택</button>
        </div>

        <div id="draw-panel" class="draw-panel" role="tabpanel" aria-labelledby="draw-tab">
          <div class="canvas-frame">
            <canvas id="drawing-canvas" width="768" height="768" aria-label="그림 그리기 영역"></canvas>
            <span class="canvas-hint" id="canvas-hint">손가락이나 펜으로 그려 보세요</span>
          </div>

          <div class="drawing-controls" aria-label="그리기 도구">
            <label class="control-field color-field">
              <span>색상</span>
              <input id="brush-color" type="color" value="#172231" aria-label="펜 색상" />
            </label>
            <label class="control-field size-field">
              <span>굵기 <output id="brush-size-output">14</output></span>
              <input id="brush-size" type="range" min="2" max="48" value="14" aria-label="펜 굵기" />
            </label>
            <div class="tool-buttons">
              <button type="button" id="pen-tool" aria-pressed="true">펜</button>
              <button type="button" id="eraser-tool" aria-pressed="false">지우개</button>
              <button type="button" id="undo-button" disabled>실행 취소</button>
              <button type="button" id="clear-canvas-button" disabled>전체 지우기</button>
            </div>
          </div>

          <button type="button" class="add-drawing-button" id="add-drawing-button" disabled>이 그림을 전송 목록에 추가</button>
        </div>

        <div id="file-panel" role="tabpanel" aria-labelledby="file-tab" hidden>
          <label class="file-zone" for="image-input" id="file-zone">
            <input id="image-input" name="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
            <span class="file-zone__icon" aria-hidden="true">＋</span>
            <strong>이미지 고르기</strong>
            <small>PNG · JPG · JPEG · WEBP · GIF</small>
          </label>
        </div>

        <div id="selection" class="selection" hidden>
          <div class="selection__head">
            <strong id="selection-count">0장 선택</strong>
            <button type="button" class="text-button" id="clear-button">목록 전체 지우기</button>
          </div>
          <div id="preview-list" class="preview-list" aria-live="polite"></div>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <fieldset class="destination">
          <legend><span>02</span> 저장 폴더</legend>
          <label class="destination-option">
            <input type="radio" name="destination" value="input_sprites" checked />
            <span><strong>input_sprites</strong><small>스프라이트 생성 파이프라인에 바로 사용</small></span>
          </label>
          <label class="destination-option">
            <input type="radio" name="destination" value="uploads" />
            <span><strong>uploads</strong><small>원본 이미지를 우선 보관</small></span>
          </label>
        </fieldset>

        <button type="button" class="upload-button" id="upload-button" disabled>
          <span>PC로 전송</span><span aria-hidden="true">→</span>
        </button>

        <div class="progress" id="progress" hidden aria-live="polite">
          <div class="progress__labels"><span id="progress-label">전송 중…</span><span id="progress-percent">0%</span></div>
          <div class="progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress__bar" id="progress-bar"></div>
          </div>
        </div>

        <div class="message" id="message" hidden role="status"></div>
      </section>

      <footer>
        <p>그림은 투명 배경 PNG로 추가됩니다.</p>
        <p>한 번에 최대 {{ max_upload_mb }}MB · 허용 형식: {{ allowed_extensions }}</p>
        <p>PC와 태블릿을 같은 Wi‑Fi에 연결해 주세요.</p>
      </footer>
    </main>
  </body>
</html>
